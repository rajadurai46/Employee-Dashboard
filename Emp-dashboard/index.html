<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

        <div class="datetime">
            <p id="date"></p>
            <p id="time"></p>
        </div>
    </header>

    <main>

        <section class="controls">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search employee..."
                >
                <button id="searchBtn">Search</button>
            </div>

            <div class="department-buttons">
                <button class="dept-btn active" data-department="All">
                    All Employees
                </button>

                <button class="dept-btn" data-department="IT">
                    IT
                </button>

                <button class="dept-btn" data-department="HR">
                    HR
                </button>

                <button class="dept-btn" data-department="Finance">
                    Finance
                </button>

                <button class="dept-btn" data-department="Marketing">
                    Marketing
                </button>
            </div>

            <div class="sorting">
                <label for="sortSelect">Sort:</label>

                <select id="sortSelect">
                    <option value="default">Default</option>
                    <option value="nameAsc">Name ↑</option>
                    <option value="nameDesc">Name ↓</option>
                    <option value="ageAsc">Age ↑</option>
                    <option value="ageDesc">Age ↓</option>
                    <option value="salaryAsc">Salary ↑</option>
                    <option value="salaryDesc">Salary ↓</option>
                </select>
            </div>
        </section>

        <div id="statusMessage" class="status">
            Loading employees...
        </div>

        <section class="statistics">

            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

        </section>


        <section class="highest-salary">

            <h2>🏆 Highest Paid Employee</h2>

            <div id="highestEmployee">
                No employee data available
            </div>

        </section>


        <section>

            <h2 class="section-title">Employees</h2>

            <div id="employeeContainer" class="employee-container">
              
            </div>

        </section>

 
        <section class="add-section">

            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                    >
                    <small id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                    >
                    <small id="ageError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >
                    <small id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                    </select>

                    <small id="departmentError"></small>
                </div>

                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input
                        type="number"
                        id="salary"
                        placeholder="Enter salary"
                    >
                    <small id="salaryError"></small>
                </div>

                <button type="submit" class="add-btn">
                    Add Employee
                </button>

            </form>

        </section>

    </main>

    <script src="index.js"></script>

</body>
</html>
